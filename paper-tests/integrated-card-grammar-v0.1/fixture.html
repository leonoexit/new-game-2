<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Valley Cards · Integrated grammar fixture v0.1</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; background: #e9e5d9; color: #26352d; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .lab { min-height: 100dvh; display: flex; justify-content: center; gap: 24px; padding: 24px; align-items: flex-start; }
    .controls { width: 265px; padding: 18px; border-radius: 14px; background: #fffdf7; box-shadow: 0 5px 24px #28372718; }
    .controls h1 { margin: 0 0 8px; font-size: 18px; }
    .controls p, .controls li { font-size: 13px; line-height: 1.45; }
    .controls select, .controls button { width: 100%; min-height: 40px; margin-top: 8px; border-radius: 8px; border: 1px solid #839787; padding: 6px 9px; background: #fff; }
    .controls button { background: #e6f1df; font-weight: 700; }
    .controls .small { color: #607065; }
    .phone { width: 390px; max-width: 100%; height: min(844px, calc(100dvh - 48px)); min-height: 560px; display: flex; flex-direction: column; overflow: hidden; border: 5px solid #29372c; border-radius: 29px; background: #f7f5ed; box-shadow: 0 18px 48px #26352d35; position: relative; }
    .rail { padding: 14px 12px 8px; background: #f1ebd7; border-bottom: 2px solid #b6b99a; }
    .rail-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 800; font-size: 14px; }
    .stats { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .stat { background: #fffdf7; border: 1px solid #c5cbb6; border-radius: 7px; padding: 3px 7px; font-size: 12px; font-weight: 700; }
    .index { display: flex; gap: 4px; overflow-x: auto; padding: 7px 7px 8px; border-bottom: 1px solid #d6d8c7; background: #fcfbf5; flex-shrink: 0; }
    .index button { white-space: nowrap; border: 0; border-radius: 6px; background: #e8ebe0; padding: 6px 8px; font-size: 11px; font-weight: 700; }
    .index button:focus-visible, .source:focus-visible, .card:focus-visible, .utility:focus-visible { outline: 3px solid #2a75ad; outline-offset: 2px; }
    .world { overflow-y: auto; flex: 1; scroll-behavior: smooth; padding: 0 9px 15px; }
    .area { padding: 14px 2px 21px; min-height: 170px; border-bottom: 9px solid #f7f5ed; }
    .area.farm { background: #f2ead4; }
    .area.forest { background: #e5ebd8; }
    .area.river { background: #e2edf0; }
    .area.mine { background: #e7e3dc; }
    .area.commerce { background: #eee6dc; }
    .area.person { background: #ebe6ef; }
    .area-title { margin: 0 4px 10px; padding-bottom: 5px; border-bottom: 2px solid #9ba68e; font-size: 16px; }
    .area-sub { font-size: 11px; color: #5c685e; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 0 4px; }
    .card { aspect-ratio: 1 / 1; border: 2px solid #576b56; border-radius: 9px; background: #fffdf4; position: relative; overflow: hidden; box-shadow: 0 2px 0 #26352d28; outline: none; }
    .card.locked { opacity: .72; }
    .card .art { height: 74%; display: grid; place-items: center; background: linear-gradient(160deg, #dbe8cc, #a9c5a1); font-size: 54px; line-height: 1; }
    .card .art.watered { background: linear-gradient(165deg, #b7d1d5 0 58%, #4d6654 58%); }
    .card .art.plant { background: linear-gradient(165deg, #cfe4bc 0 58%, #8b7656 58%); }
    .card .art.mature { background: linear-gradient(165deg, #c7ddad 0 56%, #745d45 56%); }
    .card .art.river-art { background: linear-gradient(160deg, #a9d8de, #4b90a0); }
    .card .art.mine-art { background: linear-gradient(160deg, #d9cbb5, #826d66); }
    .card .art.shop-art { background: linear-gradient(160deg, #f4dda6, #cba77b); }
    .card .art.person-art { background: linear-gradient(160deg, #dfd1df, #bda8b9); }
    .card .name { height: 26%; display: flex; align-items: center; justify-content: center; padding: 3px 24px 3px 6px; text-align: center; font-size: 12px; font-weight: 800; line-height: 1.1; }
    .badge, .price { position: absolute; top: 5px; left: 5px; border-radius: 5px; padding: 3px 5px; background: #fffdf4; border: 1px solid #536956; font-size: 11px; font-weight: 900; }
    .price { background: #f4df97; }
    .info { position: absolute; right: 5px; bottom: 5px; border: 1px solid #89988b; border-radius: 50%; background: #fff; width: 23px; height: 23px; font-size: 12px; font-weight: 900; }
    .card-note { position: absolute; left: 5px; right: 5px; top: 45%; text-align: center; color: #fff; background: #253c2cbd; font-size: 11px; padding: 3px; border-radius: 4px; }
    .status { margin: 0 4px 10px; padding: 8px; border-radius: 7px; background: #eee9df; border: 1px solid #ada69b; font-size: 12px; font-weight: 700; }
    .utility { width: calc(100% - 8px); margin: 0 4px 8px; min-height: 46px; border: 1px solid #897895; border-radius: 8px; background: #fffafc; text-align: left; padding: 8px; font-weight: 800; }
    .utility:disabled { color: #777; background: #e8e4e8; }
    .feedback { min-height: 31px; padding: 6px 10px; background: #354c3a; color: #fff; font-size: 12px; line-height: 1.35; }
    .hand { background: #f3efdf; border-top: 2px solid #b9bba2; padding: 6px 8px 9px; flex-shrink: 0; }
    .hand-title { display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; margin-bottom: 5px; }
    .credit { border-radius: 4px; padding: 1px 6px; background: #a677c2; color: #fff; }
    .sources { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px; }
    .source { min-width: 57px; height: 62px; border: 1px solid #697766; border-radius: 6px; background: #fffef8; font-size: 10px; font-weight: 800; padding: 2px; }
    .source .icon { display: block; font-size: 23px; line-height: 31px; }
    .source.selected { background: #d8efbd; outline: 3px solid #314f32; }
    .source .count { color: #48614c; }
    .overlay { position: absolute; inset: 0; z-index: 10; background: #1d2d24aa; display: none; justify-content: center; align-items: center; padding: 16px; }
    .overlay.open { display: flex; }
    .panel { width: 100%; max-height: 86%; overflow-y: auto; background: #fffdf5; border-radius: 12px; box-shadow: 0 10px 30px #13221966; padding: 15px; }
    .panel-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
    .panel h2 { margin: 0; font-size: 18px; }
    .panel p { font-size: 13px; line-height: 1.4; }
    .panel-feedback { padding: 8px; border: 1px solid #627961; border-radius: 6px; background: #e7f0df; color: #26352d; }
    .panel button { border: 1px solid #627961; border-radius: 7px; min-height: 36px; padding: 5px 9px; background: #e7f0df; font-weight: 800; }
    .panel .close { background: #fff; }
    .panel .row { display: flex; gap: 8px; align-items: center; margin: 9px 0; }
    .panel input[type=number] { width: 75px; min-height: 38px; border: 1px solid #80907e; border-radius: 5px; padding: 5px; }
    .panel .card { width: 150px; max-width: 100%; margin: 8px auto; }
    .entries { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .entry { border: 1px solid #b8c5b0; border-radius: 7px; min-height: 45px; padding: 8px; background: #eff4e8; font-size: 11px; font-weight: 800; }
    .entry.hidden { background: #e8e8e2; color: #777; }
    .muted { color: #647468; }
    @media (max-width: 730px) { .lab { display: block; padding: 0; } .controls { width: 100%; border-radius: 0; box-shadow: none; padding: 10px 14px; } .controls h1, .controls p, .controls ol { display: none; } .controls select, .controls button { width: auto; max-width: 60%; } .phone { margin: 0 auto; border-radius: 0; border: 0; width: 100%; height: calc(100dvh - 86px); min-height: 400px; box-shadow: none; } }
    @media (prefers-reduced-motion: reduce) { .world { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="lab">
    <aside class="controls" aria-label="Điều khiển fixture, không phải UI game">
      <h1>Fixture card grammar v0.1</h1>
      <p>Chọn một trạng thái cố định để thử. Đây là điều khiển ngoài game; các hình biểu tượng chỉ là chỗ giữ chỗ cho art.</p>
      <label for="preset">Tình huống</label>
      <select id="preset">
        <option value="farm">Farm ngày nắng</option>
        <option value="rain">Farm ngày mưa</option>
        <option value="forest">Rìa Rừng</option>
        <option value="river">River & Mine</option>
        <option value="river-rain">River · Blue Eel khi mưa</option>
        <option value="nell">Nell & AP relief</option>
        <option value="commerce">Commerce & Bin</option>
        <option value="tv">TV</option>
      </select>
      <button id="reset">Đặt lại tình huống</button>
      <button id="sleep">Sleep / ngày sau</button>
      <p class="small">Đọc <a href="README.md">README</a> để biết luật nào đã chốt và giới hạn của fixture. Không dùng phiên này để đánh giá chất lượng art.</p>
    </aside>
    <main class="phone" aria-label="Màn hình thử Little Valley Cards">
      <div class="rail" id="rail"></div>
      <nav class="index" id="index" aria-label="Chỉ mục Area"></nav>
      <div class="world" id="world"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="hand" id="hand"></div>
      <div class="overlay" id="overlay" role="dialog" aria-modal="true"></div>
    </main>
  </div>
  <script src="fixture.js"></script>
</body>
</html>
